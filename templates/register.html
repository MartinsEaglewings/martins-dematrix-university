<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | MDU</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

<div class="auth-card">

    <div class="logo large">MDU</div>

    <h1>Create Student Account</h1>
    <p>Register for the Martins DeMatrix University portal.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">

        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            placeholder="Enter your full name"
            required
        >

        <label>Email Address</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <button type="submit" class="primary-btn full">
            Create Account
        </button>

    </form>

    <p class="auth-link">
        Already registered?
        <a href="/login">Sign in</a>
    </p>

    <a href="/" class="back-link">← Back to University</a>

</div>

</body>
</html>
